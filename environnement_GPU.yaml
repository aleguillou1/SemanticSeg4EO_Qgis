# environment_gpu.yml
# Environnement Conda pour SemanticSeg4EO avec GPU (CUDA 11.8)
# Création : conda env create -f environment_gpu.yml
# Activation : conda activate seg4eo-gpu

name: semanticseg4EO
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip

  # ===== Géospatial (obligatoire) =====
  - rasterio>=1.3.0
  - geopandas>=0.14.0
  - fiona>=1.9.0
  - pyproj>=3.5.0
  - shapely>=2.0.0

  # ===== Traitement d'image =====
  - opencv>=4.8.0
  - scipy>=1.11.0
  - matplotlib>=3.7.0
  - tqdm>=4.66.0

  # ===== Utilitaires =====
  - scikit-learn>=1.3.0
  - tifffile>=2023.0.0
  - imagecodecs>=2023.0.0

  # ===== Deep Learning avec GPU =====
  - pytorch=2.0.1               # version compatible CUDA 11.8
  - torchvision=0.15.2
  - pytorch-cuda=11.8           # pilotes CUDA pour PyTorch

  # ===== Librairies de modèles (installées via pip) =====
  - pip:
    - segmentation-models-pytorch>=0.3.3
    - transformers>=4.30.0
    - timm>=0.9.0
    - scikit-image>=0.21.0      # pour certaines augmentations
    - albumentations>=1.3.0     # optionnel mais recommandé
    - seaborn>=0.12.0           # pour des plots plus jolis